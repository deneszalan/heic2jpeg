name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published] # a release created on github.com gets the .exe attached
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version tag, e.g. v1.0.0 (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: write # lets version tags publish a GitHub release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run tests
        run: pytest -q

      - name: Build the portable .exe
        run: pyinstaller --noconfirm packaging/heic2jpeg.spec

      - name: Self-test the .exe
        shell: pwsh
        run: |
          $exe = Get-Item "dist\HEIC-to-JPEG-Converter.exe"
          "Size: {0:N1} MB" -f ($exe.Length / 1MB)
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest", "selftest" -Wait -PassThru
          "Self-test took {0:N1} s (including unpacking)" -f $timer.Elapsed.TotalSeconds
          Get-Content selftest\selftest.txt
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: HEIC-to-JPEG-Converter
          path: dist/HEIC-to-JPEG-Converter.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-report
          path: selftest/

      - name: Publish release
        # Runs for version tags, manual runs with a version, and pushes to the default branch.
        # On the default branch it publishes v<__version__> once; bump the version for a new release.
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.release != '')
          || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release }}
          TARGET: ${{ github.sha }}
        run: |
          $automatic = $env:EVENT -eq 'push' -and $env:REF_TYPE -eq 'branch'
          if ($automatic) {
            $version = (Select-String -Path src/heic2jpeg/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
            $tag = "v$version"
          } elseif ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG
          } else {
            $tag = $env:REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tags look like v1.2.3, got '$tag'" }

          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $automatic) {
            "Release $tag already exists. Bump __version__ to publish a new one."
            exit 0
          }
          if ($exists) {
            # e.g. a release created by hand on GitHub: attach (or replace) the .exe.
            gh release upload $tag "dist/HEIC-to-JPEG-Converter.exe" --clobber
          } else {
            gh release create $tag "dist/HEIC-to-JPEG-Converter.exe" --target $env:TARGET --title "HEIC to JPEG Converter $tag" --notes-file packaging/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing release $tag failed" }
          "Published $tag"
