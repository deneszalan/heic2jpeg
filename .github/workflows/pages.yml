name: Web app

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install pillow pillow-heif pytest playwright
          python -m playwright install --with-deps chromium

      - name: Test the web app in Chromium
        run: pytest -q tests/web

  deploy:
    needs: test
    # Publishes web/ from the default branch once GitHub Pages is switched on
    # (Settings -> Pages -> Source: GitHub Actions).
    if: >-
      github.event_name != 'pull_request'
      && github.ref_name == github.event.repository.default_branch
      && github.event.repository.has_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
